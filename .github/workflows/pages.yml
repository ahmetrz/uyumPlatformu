name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Pages'i yapılandır (kapalıysa etkinleştir)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: docs/ klasörünü paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
