  # ── STATİK DEMO · ORTAMI FARKLI, KENDİ DERLEMESİNİ YAPAR ─────────────
  # `NEXT_PUBLIC_DEMO=1` derlemeye GÖMÜLÜR: paylaşılan üretim artefaktını
  # indirip burada bu değişkeni vermek HİÇBİR ŞEY yapmazdı — çıktı yine
  # üretim derlemesi olurdu ve kapı yeşil yanardı. Ölçüldü: `demo:build`
  # betiği bu değişkeni kendi ayarlamıyor, iş akışında duruyor; yerelde
  # koşan şey statik dışa aktarım değil ikinci bir sunucu derlemesiydi ve
  # "statik demo bozulmadı, ölçüldü" cümlesi yazıldığı anda yanlıştı.
  #
  # Bu yüzden bu iş artefakt İNDİRMEZ, kendi derlemesini yapar. Beyanı
  # (`demo`) üreticininkinden farklıdır ve kural tam olarak budur.
  #
  # Marka kapısı burada durur çünkü kendi derlemesini yapar ve `out/` ile
  # `.next` dizinlerini silerek biter; statik demonun ardından koşması
  # aynı işin devamıdır.
  kapi-demo:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      DERLEME_ORTAMI: demo
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: web
        run: npm ci

      - name: Veritabanını hazırla
        working-directory: web
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npx tsx prisma/seed.ts

      # `npx next build` DEĞİL: o, zincirin yalnız ilk halkasıdır ve
      # demo-yol · yayin-kontrol · statik-kontrol · kolon-hizasi
      # kapılarını atlıyordu. Dördü de `publish.yml` içindeydi, yani
      # main'e GİRDİKTEN sonra koşuyordu; bir PR'ı bloklamayan kapı kapı
      # değildir.
      - name: Statik demo derlemesi ve doğrulaması
        working-directory: web
        env:
          NEXT_PUBLIC_DEMO: '1'
        run: npm run demo:build

      # Ürün adının tek kaynaktan geldiğini DAVRANIŞLA ölçer: nöbetçi bir
      # adla derler ve üretilen çıktıya bakar.
      - name: Marka kapısı
        working-directory: web
        run: npm run marka:kapi

  # ── TOPLAYICI · dal korumasındaki AD KORUNUR ─────────────────────────
  # `kapi-yavas` artık kapı KOŞMAZ, kapıların sonucunu TOPLAR. Adı
  # korunuyor çünkü bir depo ayarının (ruleset → required checks) içinde
  # de duruyor ve o ayar koddan görünmez: işi silmek ya da yeniden
  # adlandırmak merge'i sessizce kilitlerdi.
  #
  # `if: always()` ŞART. Bayraksız bir toplayıcı, `needs`inden biri
  # düştüğünde ATLANIR — ve atlanan bir zorunlu check, korumada
  # kırmızı değil NÖTR görünür. Yani tam da kapının kırmızı olduğu anda
  # koruma açılırdı.
  #
  # `skipped` KABUL EDİLİR: taslak PR'da beş işin beşi de atlanır ve bu,
  # bölünmeden önceki davranışın aynısıdır (`kapi-yavas` taslakta hiç
  # koşmuyordu). Kabul edilen tek şey budur — `failure` ve `cancelled`
  # kırmızıdır.
  kapi-yavas:
    needs: [derleme, kapi-rota, kapi-gezinme, kapi-tasma, kapi-axe, kapi-demo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tarayıcılı kümenin sonucunu TOPLA
        env:
          DERLEME: ${{ needs.derleme.result }}
          SONUCLAR: >-
            kapi-rota=${{ needs.kapi-rota.result }}
            kapi-gezinme=${{ needs.kapi-gezinme.result }}
            kapi-tasma=${{ needs.kapi-tasma.result }}
            kapi-axe=${{ needs.kapi-axe.result }}
            kapi-demo=${{ needs.kapi-demo.result }}
        run: |
          echo "  derleme=$DERLEME"
          # `derleme` DE `needs`tedir. Olmasaydı: derleme düşer, dört
          # tarayıcılı iş `skipped` olur, toplayıcı "atlandı" görüp YEŞİL
          # yanardı — tam da hiçbir kapının ölçülmediği anda. Ölçüldü:
          # `eb2cdeb` koşumunda derleme artefakt yüklemede düştü ve dördü
          # de atlandı. Derlemenin `if:` koşulu yoktur, yani atlanamaz;
          # `success` dışındaki her sonucu kırmızıdır.
          if [ "$DERLEME" != "success" ]; then
            echo "KIRMIZI: derleme=$DERLEME — tarayıcılı kapılar artefaktsız kaldı;"
            echo "atlanmaları 'geçti' değildir."
            exit 1
          fi
          gecen=0; atlanan=0; kirmizi=0
          for s in $SONUCLAR; do
            durum=${s#*=}
            case "$durum" in
              success) echo "  geçti      $s"; gecen=$((gecen + 1)) ;;
              skipped) echo "  atlandı    $s"; atlanan=$((atlanan + 1)) ;;
              *) echo "  KIRMIZI    $s"; kirmizi=1 ;;
            esac
          done
          if [ "$kirmizi" != 0 ]; then
            echo "tarayıcılı kümede kırmızı var — toplayıcı da kırmızıdır"; exit 1
          fi
          # KARIŞIK DURUM DA KIRMIZIDIR: taslak PR'da BEŞİ birden atlanır.
          # Bir kısmı koşup bir kısmı atlandıysa atlanma sebebi taslak
          # değildir ve o kapılar ÖLÇÜLMEMİŞTİR.
          if [ "$gecen" != 0 ] && [ "$atlanan" != 0 ]; then
            echo "KARIŞIK DURUM: $gecen geçti, $atlanan atlandı — atlanma sebebi taslak DEĞİL"
            exit 1
          fi
          if [ "$atlanan" != 0 ]; then
            echo "tarayıcılı küme: taslak PR — beşi de atlandı (ölçülmedi)"
          else
            echo "tarayıcılı küme: beşi de geçti"
          fi

  # ── PostgreSQL koşusu (R5) ──────────────────────────────────────────────
  # SQLite geliştirme ve demo için KALIR; müşteri kurulumu PostgreSQL'dir ve
  # "iki sağlayıcıda da aynı garantiler" iddiası ancak İKİSİNİ DE koşarak
  # ölçülür. Ölçüldü (9 Eylül 2026): yalnız SQLite koşulurken PostgreSQL'de
  # iki tetikleyici ve üç indeks eksikti, dört değişmezlik iddiası hiç
  # ölçülmüyordu ve arama sonuçları sırasızdı — hiçbiri SQLite'ta görünmedi.
  kapi-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: kapi
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PG_URL: postgresql://postgres:kapi@127.0.0.1:5432/postgres
      TEST_PG_URL: postgresql://postgres:kapi@127.0.0.1:5432/postgres
      TEST_PG_SABLON: uyum_test_sablonu
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      # Bu iş TAM KÜMEYİ koşar ve kümede cırcır dişleri var: kalite borcu,
      # sektör terimi, NULL-olumsuzlama ve kapsam omurgası listeleri TABAN
      # DALLA karşılaştırılır. Diş "CI'da ATLANMAZ" der ve doğru davranır —
      # eksik olan bu adımdı (ölçüldü: `kapi-postgres` üç bekçide "taban dal
      # okunamadı" diye kırmızı yandı; kusur kodda değil iş akışındaydı).
      # Refspec ZORLAMALIDIR (`+`): ileri-sarım olmayan bir güncellemede
      # zorlamasız fetch reddedilir, `continue-on-error` bunu yutar ve
      # cırcır dişleri PR ile ilgisi olmayan bir sebeple kırmızı yanar.
      # Öbür iki iş zaten `+` kullanıyor (bağımsız inceleme, tur 2).
      - name: Taban dalı al (bekçi cırcırı)
        continue-on-error: true
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıklar
        working-directory: web
        run: npm ci

      # Göç + değişmezlik + NESNE ENVANTERİ kapısı: SQLite'ta olup
      # PostgreSQL'de olmayan tetikleyici/indeks KIRMIZIDIR. Üretilen
      # istemciye ihtiyaç duymaz (prisma CLI + psql).
      - name: PostgreSQL göç ve değişmezlik kapısı
        working-directory: web
        run: npm run kapi:pg-goc

      # Sağlayıcı yaşam döngüsü ARACIN KENDİSİNDE: istemciyi PostgreSQL için
      # üretir, şablonu kurar, testleri koşar, istemciyi SQLite'a GERİ ALIR ve
      # geri aldığını ÖLÇER. Üç ayrı adım olsaydı `kapi:parti` onları kapı
      # sanar ve dizini PostgreSQL istemcisiyle bırakırdı.
      - name: Birim ve entegrasyon testleri (PostgreSQL)
        working-directory: web
        run: npm run test:pg

  # ── COMPOSE KURULUMU · duman kapısı (P7 · 2.5) ───────────────────────
  #
  # Ürünün MÜŞTERİ ORTAMINDA çalıştığının tek kanıtı. `next dev` ile koşan
  # kapılar geliştirme kabuğunu ölçer: orada kaynak ağacı, geliştirme
  # veritabanı ve derlenmemiş sayfa vardır — kurulumda hiçbiri yoktur.
  #
  # İş AYRI: imaj derlemesi dakikalar sürer ve öbür kapıları bekletmemeli.
  # Playwright tarayıcısı gerekir (duman testi gerçek tarayıcıyla gezer).
  kapi-compose:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıklar
        working-directory: web
        run: npm ci

      - name: Tarayıcı kur
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Yığını kaldırır, READINESS bekler, kurulumu tohumlar, dinamik rota
      # değerlerini KURULUMUN veritabanından okur, duman testini yayımlanan
      # porta karşı koşar, indirir ve İNDİĞİNİ DOĞRULAR.
      - name: Compose kurulumunda rota duman testi
        working-directory: web
        run: npm run kapi:compose

      # Yığın kapının kendi temizliğiyle iner; iş düşerse (zaman aşımı,
      # iptal) burada da indirilir. Adım SONUCUNU DOĞRULAR: `|| true` ile
      # susturulan bir temizlik, başarısız OLAMAYAN bir adımdır ve adım
      # değildir. Kapının env dosyası mutlu yolda silinmiş olabilir; o
      # yüzden `down` env dosyası olmadan, proje adıyla çağrılır.
      - name: Yığını indir ve indiğini DOĞRULA (her koşulda)
        if: always()
        working-directory: deploy/compose
        run: |
          docker compose -p uyum-kapi-duman down -v --remove-orphans
          kalan=$(docker compose -p uyum-kapi-duman ps -q | wc -l)
          if [ "$kalan" != "0" ]; then echo "$kalan kapsayıcı ayakta kaldı"; exit 1; fi
          if curl -s -o /dev/null --max-time 2 http://127.0.0.1:3200/; then
            echo "port 3200 hâlâ cevap veriyor"; exit 1
          fi
          echo "temiz · kapsayıcı 0 · port 3200 kapalı"
