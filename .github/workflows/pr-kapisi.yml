name: PR kapısı

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Gecelik: yavaş küme main üstünde kendi başına koşar. Taslak PR'da
  # koşmayan bir kapı, hiç koşmayan bir kapı olmasın.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-kapisi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── HIZLI KÜME · her push ────────────────────────────────────────────
  # Adı `kapi` OLARAK KALIR: `main` dal korumasında zorunlu status check
  # bu addır. Yeniden adlandırmak merge'i kilitlerdi — kapının adı bir
  # depo ayarının içinde de duruyor ve o ayar koddan görünmez.
  #
  # Buraya yalnız TARAYICI İSTEMEYEN kapılar girer. Hedef 5 dakikanın
  # altı: ölçüldü, tarayıcılı blok tek başına ~7 dakika sürüyordu ve her
  # push'ta ödeniyordu.
  kapi:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
        with:
          # Kalite borcu cırcırı dal listesini `origin/main` ile
          # karşılaştırır (DİŞ 3). Sığ klonda taban dal okunamaz ve kapı
          # bilerek KIRMIZI yanar (DİŞ 4) — o yüzden tam geçmiş gerekir.
          fetch-depth: 0

      # Cırcır, DALIN kendi listesini TABANLA karşılaştırır. Taban olarak
      # `origin/main` HAREKETLİ ucu alınamaz: PR'ın merge ref'i oluştuktan
      # sonra main ilerleyip bir borç satırını silerse, dalın DEĞİŞMEMİŞ
      # listesi "eklenmiş" görünür ve CI yanlış yere kırmızı yanar. Taban,
      # kontrol edilen merge'ün kurulduğu commit'tir: `base.sha`.
      - name: Taban commit'i getir (kalite borcu cırcırı · DİŞ 3)
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin '${{ github.event.pull_request.base.sha }}'

      # Sektör terimi bekçisinin (`tests/bekci/sektor-terimi.test.ts`) dördüncü
      # dişi izin listesini TABAN DALDAKİ hâliyle karşılaştırır: liste yalnız
      # erimeli, bir dosyayı temizleyip yerine başkasını koyma takası da
      # yakalanmalı. `checkout` PR'da yalnız birleşme commit'ini sığ alır,
      # `origin/main` ref'i olmaz; bu adım onu getirir.
      #
      # `continue-on-error` adımı SESSİZ YAPMAZ: bu adım düşerse bekçi
      # CI'da KIRMIZI yanar ("CI'da taban dal okunamadı"). Bayrağın tek
      # işi, hatayı ham bir git çıktısı olarak işi durdurmak yerine öbür
      # kapılar da koştuktan sonra bekçinin gerekçeli mesajıyla
      # göstermek. Yerelde (CI değişkeni yokken) diş atlanır ve
      # "ölçülmedi" denir — orada taban dalın yokluğunun meşru sebepleri
      # var, CI'da yok.
      - name: Taban dalı al (bekçi cırcırı)
        continue-on-error: true
        run: git fetch --depth=1 origin main:refs/remotes/origin/main

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: web
        run: npm ci

      - name: Veritabanını hazırla
        working-directory: web
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npx tsx prisma/seed.ts

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Tip denetimi
        working-directory: web
        run: npx tsc --noEmit

      - name: Birim ve entegrasyon testleri
        working-directory: web
        run: npm test

      # Test envanteri (`arac/test-envanteri.json`) elle tutulan bir sayı
      # değil, keşifle doğrulanan bir kayıttır: bayatlarsa kapı kırmızı.
      - name: Test envanteri tazeliği
        working-directory: web
        run: npm run sayimlar:denetle

      - name: Ters kapsam kapısı
        working-directory: web
        run: npm run ters:kapsam

      - name: Bozuk durum ve dil kapısı
        working-directory: web
        run: npm run tasarim:dil

      - name: Tasarım kapısı
        working-directory: web
        run: npm run tasarim:kapi

      # Her `package.json` betiği ya bu iş akışında koşar ya
      # `arac/kapi-farki.mjs` BEYAN tablosunda gerekçesiyle durur.
      # Beyansız betik kapıyı kırmızı yakar: yeni bir kapı yazıp CI'ya
      # bağlamayı unutmak bir daha sessiz olmasın.
      # P1'in getirdiği üç tarayıcısız kapı. `kapi:farki` üçünü de beyansız
      # betik diye kırmızı yaktı; doğru cevap gerekçe yazmak değil,
      # bağlamaktı. (`kapi:iki-sozluk` canlı sunucu ister ve ~25 dk sürer;
      # o beyanda duruyor.)
      - name: Sözlük kipi kapısı
        working-directory: web
        run: npm run sozluk:kip

      - name: Şema sapması kapısı
        working-directory: web
        run: npm run kapi:sema-sapmasi

      # Göç zinciri kapısı: BOŞ veritabanında `migrate deploy` → schema.prisma
      # ile fark sıfır. Şema sapması kapısı MEVCUT dev.db'yi ölçer; elle
      # düzeltilmiş bir göç (P4 · 2.4: RedefineTables → ADD COLUMN) diskte
      # doğru, zincirde yanlış olabilir. Müşteri kurulumu yalnız zinciri görür.
      - name: Göç zinciri kapısı (boş veritabanı)
        working-directory: web
        run: npm run kapi:goc-zinciri

      # PostgreSQL taban göçü TAZELİK kapısı (R5): veritabanı İSTEMEZ, yalnız
      # şemadan yeniden üretip depodakiyle karşılaştırır. Şema değişip taban
      # güncellenmezse yeni PostgreSQL kurulumu şemadan ayrışır.
      - name: PostgreSQL taban göçü tazeliği
        working-directory: web
        run: npm run kapi:pg-taban

      # Gerekçe taraması bir KAPI DEĞİL: sezgisel kalıp, çıktısı elle
      # sınıflandırılır. CI'da koşması yine de değerli — maliyeti anlatan
      # yeni bir gerekçe girdiğinde kayıtta görünür, kimseyi bloklamaz.
      - name: Gerekçe taraması (bilgi)
        working-directory: web
        continue-on-error: true
        run: npm run gerekce:tarama

      - name: Kapı farkı kapısı
        working-directory: web
        run: npm run kapi:farki

      - name: Üretim derlemesi
        working-directory: web
        run: npm run build

  # ── YAVAŞ KÜME · taslak olmayan PR + gecelik ─────────────────────────
  # Tarayıcı isteyen ve kendi derlemesini yapan kapılar. Ölçüldü: duman
  # 32sn · gezinme 45sn · taşma 180sn · axe 190sn · demo:build 150sn ·
  # marka 12sn — kurulumla birlikte tek başına yedi dakikanın üstünde ve
  # her push'ta ödeniyordu.
  #
  # NE ZAMAN KOŞAR: PR taslak DEĞİLKEN (merge'e hazırlandığında), her
  # gece main üstünde, ve elle. Taslak PR'da koşmaz — iterasyonun
  # maliyeti oradadır. Gecelik koşum bir gevşetme değil sigortadır:
  # taslakta bırakılan bir dal bile ertesi sabah bu kümeden geçer.
  #
  # Bu iş dal korumasında ZORUNLU DEĞİLDİR: zorunlu status check `kapi`
  # adını taşır ve o hızlı iştir. Bu kümeyi de zorunlu tutmak bir DEPO
  # AYARIDIR (ruleset → required checks → `kapi-yavas`), kodla
  # kapatılamaz.
  #
  # `kapi:iki-sozluk` bilerek BURADA DEĞİL: bugün bağlanırsa kırmızı
  # yanar (kardeşi `tasarim:dizustu`nun 1366×768 bandı borç listesinde
  # yok — R0-12) ve beyanı `kapi-farki.mjs`te durur. Kapı, hayal edilen
  # değil ÖLÇÜLMÜŞ bir kusur için bağlanır.
  kapi-yavas:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
        with:
          # Kalite borcu cırcırı dal listesini `origin/main` ile
          # karşılaştırır (DİŞ 3). Sığ klonda taban dal okunamaz ve kapı
          # bilerek KIRMIZI yanar (DİŞ 4) — o yüzden tam geçmiş gerekir.
          fetch-depth: 0

      # Cırcır, DALIN kendi listesini TABANLA karşılaştırır. Taban olarak
      # `origin/main` HAREKETLİ ucu alınamaz: PR'ın merge ref'i oluştuktan
      # sonra main ilerleyip bir borç satırını silerse, dalın DEĞİŞMEMİŞ
      # listesi "eklenmiş" görünür ve CI yanlış yere kırmızı yanar. Taban,
      # kontrol edilen merge'ün kurulduğu commit'tir: `base.sha`.
      - name: Taban commit'i getir (kalite borcu cırcırı · DİŞ 3)
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin '${{ github.event.pull_request.base.sha }}'

      # Sektör terimi bekçisinin (`tests/bekci/sektor-terimi.test.ts`) dördüncü
      # dişi izin listesini TABAN DALDAKİ hâliyle karşılaştırır: liste yalnız
      # erimeli, bir dosyayı temizleyip yerine başkasını koyma takası da
      # yakalanmalı. `checkout` PR'da yalnız birleşme commit'ini sığ alır,
      # `origin/main` ref'i olmaz; bu adım onu getirir.
      #
      # `continue-on-error` adımı SESSİZ YAPMAZ: bu adım düşerse bekçi
      # CI'da KIRMIZI yanar ("CI'da taban dal okunamadı"). Bayrağın tek
      # işi, hatayı ham bir git çıktısı olarak işi durdurmak yerine öbür
      # kapılar da koştuktan sonra bekçinin gerekçeli mesajıyla
      # göstermek. Yerelde (CI değişkeni yokken) diş atlanır ve
      # "ölçülmedi" denir — orada taban dalın yokluğunun meşru sebepleri
      # var, CI'da yok.
      - name: Taban dalı al (bekçi cırcırı)
        continue-on-error: true
        run: git fetch --depth=1 origin main:refs/remotes/origin/main

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: web
        run: npm ci

      - name: Veritabanını hazırla
        working-directory: web
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npx tsx prisma/seed.ts


      # Yavaş küme KENDİ derlemesini yapar: sunucu taze derlemeden
      # kalkmalı (arac/BENIOKU.md → ORTAM TAZELİĞİ). Hızlı işin
      # derlemesi başka bir runner'da kaldı ve buraya taşınmaz.
      - name: Üretim derlemesi
        working-directory: web
        run: npm run build

      # ── Tarayıcılı kapılar ────────────────────────────────────────────
      # Dördü de canlı sunucu ister ve uzun süre "elle koşulur" diye CI'nın
      # dışında kaldı; dışarıda kalan kapı, kusuru kalıcılaştırır (ölçüldü:
      # /omur taşması ve 49 rotadaki durum şeridi kırpılması aylarca
      # kimsenin koşmadığı bir kapının arkasında durdu; rota duman ve
      # gezinme kapıları ise KIRIK hâlde main'e girdi ve kimse görmedi).
      #
      # Bugün BLOKLAYICIDIR. Taşma ve axe kapılarının açık bulguları
      # `arac/kalite-borcu.json`
      # izin listesindedir ve liste bir CIRCIRLA korunur: yalnız küçülebilir.
      # Listede olmayan ya da tavanı aşan her bulgu kapıyı kırmızı yakar.
      #
      # Tarayıcı runner imajına bırakılmaz: Playwright'ın kendi chromium'u
      # kurulur, böylece kapı imaj değişikliğiyle sessizce kaymaz.
      - name: Tarayıcıyı kur (kalite kapıları)
        working-directory: web
        run: node node_modules/playwright-core/cli.js install --with-deps --no-shell chromium

      - name: Sunucuyu başlat (3210)
        working-directory: web
        run: |
          nohup npx next start -p 3210 > /tmp/kapi-sunucu.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3210/giris; then
              echo "sunucu hazır ($((i * 2))sn)"; exit 0
            fi
            sleep 2
          done
          echo "sunucu 120sn içinde açılmadı"; cat /tmp/kapi-sunucu.log; exit 1

      # İşlevsel duman testleri ÖNCE koşar: bir rota 404 veriyorsa ya da
      # gezinme kırıksa, aynı sayfadaki piksel ölçümleri gürültüdür.
      # İkisi de aylarca CI dışında kaldı ve #28 ortak `girisYap`a bir adım
      # ekleyince ikisi de sessizce kırıldı — koşmayan kapı, kırıldığını da
      # söyleyemez. Fark `npm run kapi:farki` ile sayılır.
      - name: Rota duman testi · 58 rota
        working-directory: web
        env:
          PORT: '3210'
        run: npm run rota:duman

      - name: Gezinme kapısı · yedi bant
        working-directory: web
        env:
          PORT: '3210'
        run: npm run gezinme:test

      - name: Yatay taşma ve kırpılan içerik kapısı
        working-directory: web
        env:
          PORT: '3210'
          KALITE_TABAN_DAL: ${{ github.event.pull_request.base.sha }}
        run: node arac/yatay-tasma.mjs

      - name: Erişilebilirlik kapısı · axe · üç bant
        working-directory: web
        env:
          PORT: '3210'
          KALITE_TABAN_DAL: ${{ github.event.pull_request.base.sha }}
        run: node arac/erisim-axe.mjs

      # NEDEN BURADA: bu bir TEMİZLİKTİR, demo derlemesinin ÖN KOŞULU
      # değil. Bu yorum bir zamanlar "statik demo derlemesi `.next`'i
      # devralır; sunucu önce durmalı" diyordu — ÖLÇÜLDÜ ve YANLIŞ çıktı
      # (8 Eyl 2026). `demo:build` sunucu 3210'da AYAKTAYKEN geçti
      # (çıkış 0), sunucu derlemeden sağ çıktı, 731 dosyalık çıktı
      # eksiksizdi. Dört koşum karşılaştırıldı (biri sunucuyla, ÜÇÜ
      # sunucusuz): her çiftte 592/731 dosya derleme kimliği yüzünden,
      # 2-4 dosya da zamana bağlı içerik yüzünden (`new Date()` kullanan
      # dört ekran) değişiyor — ve bu değişimin TAMAMI sunucusuz kontrol
      # çiftlerinde de üretiliyor. Sunucuya ÖZGÜ tek bir fark yok.
      # Linux'ta `next build` tutulan `.next` inode'unun üstüne yazar;
      # ortada bir "devralma" çakışması yoktu.
      #
      # Adımın GERÇEK sebebi şudur: ayakta bırakılan sunucu bir sonraki
      # ÖLÇÜMÜ kirletir — bayat `next start`, arac/BENIOKU.md → ORTAM
      # TAZELİĞİ'nin 1. tuzağı. Aşağıdaki kusur tam olarak bunu yaşattı,
      # yani sebep gerçek; yalnız gerekçesi yanlış yazılmıştı.
      # SÜREÇ ADIYLA ÖLDÜRME — ÖLÇÜLDÜ VE İŞLEMEDİ. Bu adım bir zamanlar
      # `pkill -f 'next start' || true` idi ve HİÇBİR ŞEYİ öldürmüyordu:
      # `next start` açılıştan sonra süreç adını `next-server (vX.Y.Z)`
      # yapar, kalıp eşleşmez, `|| true` de bunu sessizleştirir. Ölçüldü
      # (8 Eyl 2026): parti kapanışından sonra sunucu PID 5777 · PPID 1
      # olarak 3210'da ayakta kaldı, `pgrep -af 'next start'` sıfır
      # eşleşme döndü. CI'da maskeliydi (runner atılıyor); YERELDE
      # `kapi:parti` aynı adımı iş akışından türettiği için her parti
      # kapanışı bayat bir sunucu bırakıyordu — yani ölçüm aracı devir
      # kaydının 1 numaralı yanlış alarm tuzağını kendisi üretiyordu.
      #
      # Port BİZİM yazdığımız sabittir; süreç adı Next'in iç detayıdır ve
      # sürümle kayar. Öldürme porttan yapılır.
      #
      # SON KOŞULUNU GARANTİ ETMEYEN ADIM, ADIM DEĞİLDİR: öldürmenin
      # ardından portun KAPANDIĞI doğrulanır, kapanmadıysa kırmızı.
      # Doğrulama öldürmeyle AYNI aracı kullanmaz (öldüren `fuser`,
      # doğrulayan `curl`) — tek araca bakan bir kontrol, o araç ortamda
      # yoksa "kapandı" der ve kandırılır.
      #
      # `fuser -k` portu tutan süreç YOKSA da sıfırdan farklı döner; bu
      # iyi hâldir, hata değildir — bu yüzden onun çıkış kodu değil, son
      # koşul ölçülür. (`if: always()` ile sunucu hiç açılmamışken de
      # koşar.)
      - name: Sunucuyu durdur
        if: always()
        run: |
          fuser -k -n tcp 3210 || echo "3210'u tutan süreç yok"
          for i in $(seq 1 10); do
            if ! curl -s -o /dev/null --max-time 2 http://localhost:3210/; then
              echo "3210 kapandı (${i}sn)"; exit 0
            fi
            sleep 1
          done
          echo "3210 HÂLÂ AÇIK — sunucu durmadı"; exit 1

      # `npx next build` DEĞİL: o, zincirin yalnız ilk halkasıdır ve
      # demo-yol · yayin-kontrol · statik-kontrol · kolon-hizasi kapılarını
      # atlıyordu. Dördü de `publish.yml` içinde, yani main'e GİRDİKTEN
      # sonra koşuyordu; bir PR'ı bloklamayan kapı kapı değildir.
      - name: Statik demo derlemesi ve doğrulaması
        working-directory: web
        env:
          NEXT_PUBLIC_DEMO: '1'
        run: npm run demo:build

      # Ürün adının tek kaynaktan geldiğini DAVRANIŞLA ölçer: nöbetçi bir
      # adla derler ve üretilen çıktıya bakar. Kendi derlemesini yaptığı
      # için en sonda durur; `out/` ve `.next` dizinlerini silerek biter.
      - name: Marka kapısı
        working-directory: web
        run: npm run marka:kapi

  # ── PostgreSQL koşusu (R5) ──────────────────────────────────────────────
  # SQLite geliştirme ve demo için KALIR; müşteri kurulumu PostgreSQL'dir ve
  # "iki sağlayıcıda da aynı garantiler" iddiası ancak İKİSİNİ DE koşarak
  # ölçülür. Ölçüldü (9 Eylül 2026): yalnız SQLite koşulurken PostgreSQL'de
  # iki tetikleyici ve üç indeks eksikti, dört değişmezlik iddiası hiç
  # ölçülmüyordu ve arama sonuçları sırasızdı — hiçbiri SQLite'ta görünmedi.
  kapi-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: kapi
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PG_URL: postgresql://postgres:kapi@127.0.0.1:5432/postgres
      TEST_PG_URL: postgresql://postgres:kapi@127.0.0.1:5432/postgres
      TEST_PG_SABLON: uyum_test_sablonu
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      # Bu iş TAM KÜMEYİ koşar ve kümede cırcır dişleri var: kalite borcu,
      # sektör terimi, NULL-olumsuzlama ve kapsam omurgası listeleri TABAN
      # DALLA karşılaştırılır. Diş "CI'da ATLANMAZ" der ve doğru davranır —
      # eksik olan bu adımdı (ölçüldü: `kapi-postgres` üç bekçide "taban dal
      # okunamadı" diye kırmızı yandı; kusur kodda değil iş akışındaydı).
      # Refspec ZORLAMALIDIR (`+`): ileri-sarım olmayan bir güncellemede
      # zorlamasız fetch reddedilir, `continue-on-error` bunu yutar ve
      # cırcır dişleri PR ile ilgisi olmayan bir sebeple kırmızı yanar.
      # Öbür iki iş zaten `+` kullanıyor (bağımsız inceleme, tur 2).
      - name: Taban dalı al (bekçi cırcırı)
        continue-on-error: true
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıklar
        working-directory: web
        run: npm ci

      # Göç + değişmezlik + NESNE ENVANTERİ kapısı: SQLite'ta olup
      # PostgreSQL'de olmayan tetikleyici/indeks KIRMIZIDIR. Üretilen
      # istemciye ihtiyaç duymaz (prisma CLI + psql).
      - name: PostgreSQL göç ve değişmezlik kapısı
        working-directory: web
        run: npm run kapi:pg-goc

      # Sağlayıcı yaşam döngüsü ARACIN KENDİSİNDE: istemciyi PostgreSQL için
      # üretir, şablonu kurar, testleri koşar, istemciyi SQLite'a GERİ ALIR ve
      # geri aldığını ÖLÇER. Üç ayrı adım olsaydı `kapi:parti` onları kapı
      # sanar ve dizini PostgreSQL istemcisiyle bırakırdı.
      - name: Birim ve entegrasyon testleri (PostgreSQL)
        working-directory: web
        run: npm run test:pg

  # ── COMPOSE KURULUMU · duman kapısı (P7 · 2.5) ───────────────────────
  #
  # Ürünün MÜŞTERİ ORTAMINDA çalıştığının tek kanıtı. `next dev` ile koşan
  # kapılar geliştirme kabuğunu ölçer: orada kaynak ağacı, geliştirme
  # veritabanı ve derlenmemiş sayfa vardır — kurulumda hiçbiri yoktur.
  #
  # İş AYRI: imaj derlemesi dakikalar sürer ve öbür kapıları bekletmemeli.
  # Playwright tarayıcısı gerekir (duman testi gerçek tarayıcıyla gezer).
  kapi-compose:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıklar
        working-directory: web
        run: npm ci

      - name: Tarayıcı kur
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Yığını kaldırır, READINESS bekler, kurulumu tohumlar, dinamik rota
      # değerlerini KURULUMUN veritabanından okur, duman testini yayımlanan
      # porta karşı koşar, indirir ve İNDİĞİNİ DOĞRULAR.
      - name: Compose kurulumunda rota duman testi
        working-directory: web
        run: npm run kapi:compose

      # Yığın kapının kendi temizliğiyle iner; iş düşerse (zaman aşımı,
      # iptal) burada da indirilir. Adım SONUCUNU DOĞRULAR: `|| true` ile
      # susturulan bir temizlik, başarısız OLAMAYAN bir adımdır ve adım
      # değildir. Kapının env dosyası mutlu yolda silinmiş olabilir; o
      # yüzden `down` env dosyası olmadan, proje adıyla çağrılır.
      - name: Yığını indir ve indiğini DOĞRULA (her koşulda)
        if: always()
        working-directory: deploy/compose
        run: |
          docker compose -p uyum-kapi-duman down -v --remove-orphans
          kalan=$(docker compose -p uyum-kapi-duman ps -q | wc -l)
          if [ "$kalan" != "0" ]; then echo "$kalan kapsayıcı ayakta kaldı"; exit 1; fi
          if curl -s -o /dev/null --max-time 2 http://127.0.0.1:3200/; then
            echo "port 3200 hâlâ cevap veriyor"; exit 1
          fi
          echo "temiz · kapsayıcı 0 · port 3200 kapalı"
