name: PR kapısı

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Gecelik: yavaş küme main üstünde kendi başına koşar. Taslak PR'da
  # koşmayan bir kapı, hiç koşmayan bir kapı olmasın.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-kapisi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── HIZLI KÜME · her push ────────────────────────────────────────────
  # Adı `kapi` OLARAK KALIR: `main` dal korumasında zorunlu status check
  # bu addır. Yeniden adlandırmak merge'i kilitlerdi — kapının adı bir
  # depo ayarının içinde de duruyor ve o ayar koddan görünmez.
  #
  # Buraya yalnız TARAYICI İSTEMEYEN kapılar girer. Hedef 5 dakikanın
  # altı: ölçüldü, tarayıcılı blok tek başına ~7 dakika sürüyordu ve her
  # push'ta ödeniyordu.
  kapi:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
        with:
          # Kalite borcu cırcırı dal listesini `origin/main` ile
          # karşılaştırır (DİŞ 3). Sığ klonda taban dal okunamaz ve kapı
          # bilerek KIRMIZI yanar (DİŞ 4) — o yüzden tam geçmiş gerekir.
          fetch-depth: 0

      # Cırcır, DALIN kendi listesini TABANLA karşılaştırır. Taban olarak
      # `origin/main` HAREKETLİ ucu alınamaz: PR'ın merge ref'i oluştuktan
      # sonra main ilerleyip bir borç satırını silerse, dalın DEĞİŞMEMİŞ
      # listesi "eklenmiş" görünür ve CI yanlış yere kırmızı yanar. Taban,
      # kontrol edilen merge'ün kurulduğu commit'tir: `base.sha`.
      - name: Taban commit'i getir (kalite borcu cırcırı · DİŞ 3)
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin '${{ github.event.pull_request.base.sha }}'

      # Sektör terimi bekçisinin (`tests/bekci/sektor-terimi.test.ts`) dördüncü
      # dişi izin listesini TABAN DALDAKİ hâliyle karşılaştırır: liste yalnız
      # erimeli, bir dosyayı temizleyip yerine başkasını koyma takası da
      # yakalanmalı. `checkout` PR'da yalnız birleşme commit'ini sığ alır,
      # `origin/main` ref'i olmaz; bu adım onu getirir.
      #
      # `continue-on-error` adımı SESSİZ YAPMAZ: bu adım düşerse bekçi
      # CI'da KIRMIZI yanar ("CI'da taban dal okunamadı"). Bayrağın tek
      # işi, hatayı ham bir git çıktısı olarak işi durdurmak yerine öbür
      # kapılar da koştuktan sonra bekçinin gerekçeli mesajıyla
      # göstermek. Yerelde (CI değişkeni yokken) diş atlanır ve
      # "ölçülmedi" denir — orada taban dalın yokluğunun meşru sebepleri
      # var, CI'da yok.
      - name: Taban dalı al (bekçi cırcırı)
        continue-on-error: true
        run: git fetch --depth=1 origin main:refs/remotes/origin/main

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: web
        run: npm ci

      - name: Veritabanını hazırla
        working-directory: web
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npx tsx prisma/seed.ts

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Tip denetimi
        working-directory: web
        run: npx tsc --noEmit

      - name: Birim ve entegrasyon testleri
        working-directory: web
        run: npm test

      # Test envanteri (`arac/test-envanteri.json`) elle tutulan bir sayı
      # değil, keşifle doğrulanan bir kayıttır: bayatlarsa kapı kırmızı.
      - name: Test envanteri tazeliği
        working-directory: web
        run: npm run sayimlar:denetle

      - name: Ters kapsam kapısı
        working-directory: web
        run: npm run ters:kapsam

      - name: Bozuk durum ve dil kapısı
        working-directory: web
        run: npm run tasarim:dil

      - name: Tasarım kapısı
        working-directory: web
        run: npm run tasarim:kapi

      # Her `package.json` betiği ya bu iş akışında koşar ya
      # `arac/kapi-farki.mjs` BEYAN tablosunda gerekçesiyle durur.
      # Beyansız betik kapıyı kırmızı yakar: yeni bir kapı yazıp CI'ya
      # bağlamayı unutmak bir daha sessiz olmasın.
      # P1'in getirdiği üç tarayıcısız kapı. `kapi:farki` üçünü de beyansız
      # betik diye kırmızı yaktı; doğru cevap gerekçe yazmak değil,
      # bağlamaktı. (`kapi:iki-sozluk` canlı sunucu ister ve ~25 dk sürer;
      # o beyanda duruyor.)
      - name: Sözlük kipi kapısı
        working-directory: web
        run: npm run sozluk:kip

      - name: Şema sapması kapısı
        working-directory: web
        run: npm run kapi:sema-sapmasi

      # Göç zinciri kapısı: BOŞ veritabanında `migrate deploy` → schema.prisma
      # ile fark sıfır. Şema sapması kapısı MEVCUT dev.db'yi ölçer; elle
      # düzeltilmiş bir göç (P4 · 2.4: RedefineTables → ADD COLUMN) diskte
      # doğru, zincirde yanlış olabilir. Müşteri kurulumu yalnız zinciri görür.
      - name: Göç zinciri kapısı (boş veritabanı)
        working-directory: web
        run: npm run kapi:goc-zinciri

      # PostgreSQL taban göçü TAZELİK kapısı (R5): veritabanı İSTEMEZ, yalnız
      # şemadan yeniden üretip depodakiyle karşılaştırır. Şema değişip taban
      # güncellenmezse yeni PostgreSQL kurulumu şemadan ayrışır.
      - name: PostgreSQL taban göçü tazeliği
        working-directory: web
        run: npm run kapi:pg-taban

      # Gerekçe taraması bir KAPI DEĞİL: sezgisel kalıp, çıktısı elle
      # sınıflandırılır. CI'da koşması yine de değerli — maliyeti anlatan
      # yeni bir gerekçe girdiğinde kayıtta görünür, kimseyi bloklamaz.
      - name: Gerekçe taraması (bilgi)
        working-directory: web
        continue-on-error: true
        run: npm run gerekce:tarama

      - name: Kapı farkı kapısı
        working-directory: web
        run: npm run kapi:farki

      # Paylaşılan derleme artefaktına dokunan HER iş, hangi derleme
      # ortamını istediğini `DERLEME_ORTAMI` ile beyan etmiş olmalı.
      # Beyansız tüketim kırmızıdır ve bu kapı onu İŞ AKIŞINDAN ölçer —
      # koşum anını beklemez.
      - name: Derleme ortamı beyanı kapısı
        working-directory: web
        run: npm run kapi:derleme-artefakti

      # HIZLI KÜMENİN KÖR NOKTASI. `tsc --noEmit` proje TypeScript'ini
      # denetler; `arac/*.mjs` içe aktarım grafiği onun kapsamında
      # DEĞİLDİR. Ölçüldü (9 Eyl 2026): `derleme-ortami.mjs` tamamen
      # değiştirildi, üç aracın (`kolon-hizasi` · `statik-kontrol` ·
      # `marka-kapisi`) ondan aldığı ihraçlar yok oldu ve hızlı küme
      # görmedi — kusur ancak YAVAŞ kümedeki `demo:build` koşunca, yani
      # bir PR turu sonra görünürdü.
      #
      # Kapı YAPISALDIR ve hiçbir modülü YÜRÜTMEZ: bu araçların çoğu CLI
      # ve içe aktarılınca koşar (`parti-kapanisi` bütün kümeyi başlatır,
      # `compose-duman` docker yığını kaldırır). İçe aktarım deyimleri
      # okunur, hedef çözülür, adlı bağların ihraç edildiği doğrulanır.
      - name: İthal zinciri kapısı (arac/*.mjs)
        working-directory: web
        run: npm run kapi:ithal-zinciri

  # ── TEK DERLEME · artefakt olarak paylaşılır ─────────────────────────
  # Üretim derlemesi bir zamanlar İKİ işte birden koşuyordu (`kapi` ve
  # `kapi-yavas`); tarayıcılı kapılar dört işe bölününce aynı derleme
  # DÖRT kez koşacaktı. Bugün bir kez koşar ve `.next` artefakt olarak
  # iner. Kazanç yalnız süre değil: dört kapı AYNI derlemeyi ölçer, dört
  # farklı derlemeyi değil.
  #
  # `if:` YOK — derleme her tetikleyicide koşar. Taslak PR'da tarayıcılı
  # kapılar atlanır ama derleme hatası atlanmaz; gecelik koşumda da
  # tarayıcılı işlerin `needs`i bu iştir ve atlanan bir `needs` bütün
  # zinciri atlatırdı.
  derleme:
    runs-on: ubuntu-latest
    env:
      # ORTAM BEYANI. Artefakta dokunan her iş bunu beyan eder; beyansız
      # tüketim kırmızıdır (`kapi:derleme-artefakti`). `NEXT_PUBLIC_*`
      # değerleri istemci paketine DERLEME ANINDA gömülür — indiren iş
      # kendi değerini verirse o değer hiçbir şey yapmaz ve ekran
      # derleyenin değerini gösterir. Ölçüldü: `NEXT_PUBLIC_DEMO`.
      DERLEME_ORTAMI: uretim
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: web
        run: npm ci

      - name: Veritabanını hazırla
        working-directory: web
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npx tsx prisma/seed.ts

      - name: Üretim derlemesi
        working-directory: web
        run: npm run build

      # Damga artefaktın İÇİNE yazılır: hangi ortamda derlendiği,
      # derlemeye hangi `NEXT_PUBLIC_*` değerlerinin gömüldüğü. İndiren
      # iş bunu kendi beyanıyla karşılaştırır.
      - name: Derleme ortamını DAMGALA
        working-directory: web
        run: node arac/derleme-artefakti.mjs --damgala

      # `.next/cache` HARİÇ: 243 MB'ın 169 MB'ı derleme önbelleğidir ve
      # `next start` onu okumaz. Ölçüldü — taşınan 74 MB.
      #
      # `include-hidden-files` ZORUNLU: `.next` NOKTAYLA başlar ve
      # `upload-artifact@v4` nokta ile başlayan yolları varsayılan olarak
      # DIŞLAR. Ölçüldü (CI, `eb2cdeb`): bayraksız koşuda adım
      # "No files were found with the provided path: web/.next" diyerek
      # düştü. Sessiz kalmadı çünkü `if-no-files-found: error` yazılıydı —
      # varsayılan `warn` olsaydı iş YEŞİL biter, tüketiciler boş bir
      # artefakt indirir ve kusur ancak sunucu açılmayınca görünürdü.
      - name: Derlemeyi yükle
        uses: actions/upload-artifact@v4
        with:
          name: derleme-uretim
          path: |
            web/.next
            !web/.next/cache
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # ── TARAYICILI KAPILAR · DÖRT PARALEL İŞ ─────────────────────────────
  # Dördü de canlı sunucu ister ve uzun süre "elle koşulur" diye CI'nın
  # dışında kaldı; dışarıda kalan kapı kusuru kalıcılaştırır (ölçüldü:
  # /omur taşması ve 49 rotadaki durum şeridi kırpılması aylarca kimsenin
  # koşmadığı bir kapının arkasında durdu; rota duman ve gezinme kapıları
  # ise KIRIK hâlde main'e girdi ve kimse görmedi).
  #
  # BUGÜN BLOKLAYICI ve PARALEL. Ölçüldü (9 Eyl 2026, `80ce71c`): seri
  # `kapi-yavas` 12 dk 54 sn sürüyordu ve bu sırada `main` iki kez
  # ilerledi, dal iki kez yeniden ölçüldü. Kapıların kendi süreleri
  # rota 36sn · gezinme 44sn · taşma 186sn · axe 190sn: toplam sürenin
  # yarısı BEKLEMEYDİ, ölçüm değil.
  #
  # Taşma ve axe kapılarının açık bulguları `arac/kalite-borcu.json`
  # izin listesindedir ve liste bir CIRCIRLA korunur: yalnız küçülebilir.
  # Tarayıcı runner imajına bırakılmaz: Playwright'ın kendi chromium'u
  # kurulur, böylece kapı imaj değişikliğiyle sessizce kaymaz.
  kapi-rota:
    needs: derleme
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      DERLEME_ORTAMI: uretim
      PORT: '3210'
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: web
        run: npm ci

      - name: Veritabanını hazırla
        working-directory: web
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npx tsx prisma/seed.ts

      - name: Derlemeyi indir
        uses: actions/download-artifact@v4
        with:
          name: derleme-uretim
          path: web/.next

      - name: Derleme ortamını DOĞRULA
        working-directory: web
        run: node arac/derleme-artefakti.mjs --dogrula

      - name: Tarayıcıyı kur (kalite kapıları)
        working-directory: web
        run: node node_modules/playwright-core/cli.js install --with-deps --no-shell chromium

      - name: Sunucuyu başlat (3210)
        working-directory: web
        run: |
          nohup npx next start -p 3210 > /tmp/kapi-sunucu.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3210/giris; then
              echo "sunucu hazır ($((i * 2))sn)"; exit 0
            fi
            sleep 2
          done
          echo "sunucu 120sn içinde açılmadı"; cat /tmp/kapi-sunucu.log; exit 1

      # İşlevsel duman testi: bir rota 404 veriyorsa aynı sayfadaki
      # piksel ölçümleri gürültüdür. Bu yüzden en kısa iş olarak ayrı
      # durur — kırmızısı en erken görünen odur.
      - name: Rota duman testi · envanterdeki tüm rotalar
        working-directory: web
        run: npm run rota:duman

      # R12 · denetim formları ekranının İKİ MERCEKTE kanıtı. Aynı sunucuyu
      # kullanır, bu yüzden ayrı bir işe değmez. Ekran iddialarını ölçmenin
      # yanında FORMU GERÇEKTEN ÜRETİR: düğmeye basar, "Boş hücre 0"
      # cümlesinin ekranda çıktığını görür ve iki dosyanın (CSV + XLSX)
      # indiğini doğrular. Ölçüldü — bu adım olmasaydı yakalanmayacak bir
      # kusur vardı: `'use server'` dosyası nesne ihraç ediyordu, tsc ve
      # lint temizdi, ekran derlendi ve düğme tarayıcıda 500 döndü.
      - name: Denetim formları kanıtı · iki bant
        working-directory: web
        run: npm run kanit:denetim-formu

      # R10 · olay → mevzuat bildirimi. Aynı sunucuyu kullanır. Saf kural
      # testte, zincir veritabanı testinde; burada ölçülen EKRANIN KENDİSİ
      # ve en pahalı iddia: REFERANSSIZ GÖNDERİM TARAYICIDA REDDEDİLİYOR
      # MU. Bu bir birim testiyle kanıtlanamaz — kapı sunucu eyleminde,
      # düğme istemcide ve arada bir sunucu eylemi sınırı var; R12'de tam
      # o sınırda bir kusur ölçüldü (tsc · lint · derleme temizdi, düğme
      # 500 döndü). FİKSTÜRÜ DEĞİŞTİRİR (bir taslağı "gönderildi" yapar);
      # CI her koşumda veritabanını yeniden kurduğu için sorun değil.
      - name: Bildirim kaydı kanıtı · iki bant
        working-directory: web
        run: npm run kanit:bildirim-kaydi

      # R10+ · takvim tetikli yükümlülük. Aynı sunucuyu kullanır. Ölçtüğü
      # dört iddia brifin 2.5 maddesidir: bir dönem AÇILIYOR · geri sayım
      # DOĞRU (ekranın kendi son tarihinden türeyen gün sayısıyla) ·
      # SÜRESİZ dönemde sayaç YOK · motor hiçbir dönemi "yapıldı"
      # yazamıyor. En pahalısı sonuncusu: referanssız teslim tarayıcıda
      # REDDEDİLİYOR mu. Fikstürü DEĞİŞTİRMEZ (red, hiçbir dönemi
      # kapatmaz) — bu yüzden bildirim kaydı kanıtından sonra koşabilir.
      - name: Bildirim dönemi kanıtı · iki bant
        working-directory: web
        run: npm run kanit:bildirim-donemi

      # P6 · kimlik ve SSO. Aynı sunucuyu kullanır ve EN SONA konur:
      # fikstüre bir kimlik sağlayıcı EKLER (giriş ekranında düğme çıkar)
      # ve sonda aktiflikten çıkarıp düğmenin DÜŞTÜĞÜNÜ doğrular —
      # temizlik adımı son koşulunu ölçer. Ölçtüğü en pahalı iddia:
      # SIR DEĞERİ HİÇBİR EKRANDA GÖRÜNMÜYOR. Kimlik jetonu doğrulaması
      # burada DEĞİL sahte bir sağlayıcıyla testte ölçülür; bu depo
      # hiçbir gerçek kimlik sağlayıcıya bağlanmaz.
      - name: Kimlik ve SSO kanıtı · iki bant
        working-directory: web
        run: npm run kanit:kimlik

      # R1 · mevzuat radarı. Aynı sunucuyu kullanır. Ölçtüğü en pahalı
      # iddia: ENGELLİ ile KARŞILAŞTIRILAMADI ekranda AYRI görünüyor —
      # biri kaynağın kararı (ürün aşmaz), öbürü bizim bilgi eksiğimiz.
      # İkisini tek sayıya toplamak, bakılamamış bir kaynağı "temiz"
      # göstermeye bir adım kalırdı. Fikstürü DEĞİŞTİRMEZ: denenen tek
      # yazma GEREKÇESİZ karardır ve reddedilir.
      - name: Mevzuat radarı kanıtı · iki bant
        working-directory: web
        run: npm run kanit:mevzuat-radari

      # SÜREÇ ADIYLA ÖLDÜRME — ÖLÇÜLDÜ VE İŞLEMEDİ. Bu adım bir zamanlar
      # `pkill -f 'next start' || true` idi ve HİÇBİR ŞEYİ öldürmüyordu:
      # `next start` açılıştan sonra süreç adını `next-server (vX.Y.Z)`
      # yapar, kalıp eşleşmez, `|| true` de bunu sessizleştirir. CI'da
      # runner atıldığı için maskeliydi; YERELDE `kapi:parti` aynı adımı
      # iş akışından türettiği için her parti kapanışı 3210'da bayat bir
      # sunucu bırakıyordu — ölçüm aracı, "bayat `next start`" tuzağını
      # kendi eliyle üretiyordu.
      #
      # Port BİZİM yazdığımız sabittir; süreç adı Next'in iç detayıdır ve
      # sürümle kayar. Öldürme porttan yapılır, sonra portun KAPANDIĞI
      # BAŞKA bir araçla doğrulanır (öldüren `fuser`, doğrulayan `curl` —
      # tek araca bakan kontrol, o araç yoksa kandırılır) ve kapanmadıysa
      # KIRMIZIDIR. Aynı adım dört tarayıcılı işin hepsinde durur; gerekçe
      # burada bir kez yazılıdır.
      - name: Sunucuyu durdur
        if: always()
        run: |
          fuser -k -n tcp 3210 || echo "3210'u tutan süreç yok"
          for i in $(seq 1 10); do
            if ! curl -s -o /dev/null --max-time 2 http://localhost:3210/; then
              echo "3210 kapandı (${i}sn)"; exit 0
            fi
            sleep 1
          done
          echo "3210 HÂLÂ AÇIK — sunucu durmadı"; exit 1

  kapi-gezinme:
    needs: derleme
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      DERLEME_ORTAMI: uretim
      PORT: '3210'
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: web
        run: npm ci

      - name: Veritabanını hazırla
        working-directory: web
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npx tsx prisma/seed.ts

      - name: Derlemeyi indir
        uses: actions/download-artifact@v4
        with:
          name: derleme-uretim
          path: web/.next

      - name: Derleme ortamını DOĞRULA
        working-directory: web
        run: node arac/derleme-artefakti.mjs --dogrula

      - name: Tarayıcıyı kur (kalite kapıları)
        working-directory: web
        run: node node_modules/playwright-core/cli.js install --with-deps --no-shell chromium

      - name: Sunucuyu başlat (3210)
        working-directory: web
        run: |
          nohup npx next start -p 3210 > /tmp/kapi-sunucu.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3210/giris; then
              echo "sunucu hazır ($((i * 2))sn)"; exit 0
            fi
            sleep 2
          done
          echo "sunucu 120sn içinde açılmadı"; cat /tmp/kapi-sunucu.log; exit 1

      - name: Gezinme kapısı · yedi bant
        working-directory: web
        run: npm run gezinme:test

      # Gerekçe `kapi-rota` işinde yazılıdır.
      - name: Sunucuyu durdur
        if: always()
        run: |
          fuser -k -n tcp 3210 || echo "3210'u tutan süreç yok"
          for i in $(seq 1 10); do
            if ! curl -s -o /dev/null --max-time 2 http://localhost:3210/; then
              echo "3210 kapandı (${i}sn)"; exit 0
            fi
            sleep 1
          done
          echo "3210 HÂLÂ AÇIK — sunucu durmadı"; exit 1

  kapi-tasma:
    needs: derleme
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      DERLEME_ORTAMI: uretim
      PORT: '3210'
      KALITE_TABAN_DAL: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
        with:
          # Kalite borcu cırcırı dal listesini taban commit'le
          # karşılaştırır (DİŞ 3). Sığ klonda taban okunamaz ve kapı
          # bilerek KIRMIZI yanar (DİŞ 4) — o yüzden tam geçmiş gerekir.
          fetch-depth: 0

      # Taban olarak `origin/main` HAREKETLİ ucu alınamaz: merge ref'i
      # kurulduktan sonra main ilerleyip bir borç satırını silerse, dalın
      # DEĞİŞMEMİŞ listesi "eklenmiş" görünür ve CI yanlış yere kırmızı
      # yanar. Taban, kontrol edilen merge'ün kurulduğu commit'tir.
      - name: Taban commit'i getir (kalite borcu cırcırı · DİŞ 3)
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin '${{ github.event.pull_request.base.sha }}'

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: web
        run: npm ci

      - name: Veritabanını hazırla
        working-directory: web
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npx tsx prisma/seed.ts

      - name: Derlemeyi indir
        uses: actions/download-artifact@v4
        with:
          name: derleme-uretim
          path: web/.next

      - name: Derleme ortamını DOĞRULA
        working-directory: web
        run: node arac/derleme-artefakti.mjs --dogrula

      - name: Tarayıcıyı kur (kalite kapıları)
        working-directory: web
        run: node node_modules/playwright-core/cli.js install --with-deps --no-shell chromium

      - name: Sunucuyu başlat (3210)
        working-directory: web
        run: |
          nohup npx next start -p 3210 > /tmp/kapi-sunucu.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3210/giris; then
              echo "sunucu hazır ($((i * 2))sn)"; exit 0
            fi
            sleep 2
          done
          echo "sunucu 120sn içinde açılmadı"; cat /tmp/kapi-sunucu.log; exit 1

      - name: Yatay taşma ve kırpılan içerik kapısı
        working-directory: web
        run: node arac/yatay-tasma.mjs

      # Gerekçe `kapi-rota` işinde yazılıdır.
      - name: Sunucuyu durdur
        if: always()
        run: |
          fuser -k -n tcp 3210 || echo "3210'u tutan süreç yok"
          for i in $(seq 1 10); do
            if ! curl -s -o /dev/null --max-time 2 http://localhost:3210/; then
              echo "3210 kapandı (${i}sn)"; exit 0
            fi
            sleep 1
          done
          echo "3210 HÂLÂ AÇIK — sunucu durmadı"; exit 1

  kapi-axe:
    needs: derleme
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      DERLEME_ORTAMI: uretim
      PORT: '3210'
      KALITE_TABAN_DAL: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Taban commit'i getir (kalite borcu cırcırı · DİŞ 3)
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin '${{ github.event.pull_request.base.sha }}'

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: web
        run: npm ci

      - name: Veritabanını hazırla
        working-directory: web
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npx tsx prisma/seed.ts

      - name: Derlemeyi indir
        uses: actions/download-artifact@v4
        with:
