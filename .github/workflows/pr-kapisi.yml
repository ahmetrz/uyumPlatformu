      - name: Derleme ortamını DOĞRULA
        working-directory: web
        run: node arac/derleme-artefakti.mjs --dogrula

      - name: Tarayıcıyı kur (kalite kapıları)
        working-directory: web
        run: node node_modules/playwright-core/cli.js install --with-deps --no-shell chromium

      - name: Sunucuyu başlat (3210)
        working-directory: web
        run: |
          nohup npx next start -p 3210 > /tmp/kapi-sunucu.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3210/giris; then
              echo "sunucu hazır ($((i * 2))sn)"; exit 0
            fi
            sleep 2
          done
          echo "sunucu 120sn içinde açılmadı"; cat /tmp/kapi-sunucu.log; exit 1

      - name: Erişilebilirlik kapısı · axe · üç bant
        working-directory: web
        run: node arac/erisim-axe.mjs

      # Gerekçe `kapi-rota` işinde yazılıdır.
      - name: Sunucuyu durdur
        if: always()
        run: |
          fuser -k -n tcp 3210 || echo "3210'u tutan süreç yok"
          for i in $(seq 1 10); do
            if ! curl -s -o /dev/null --max-time 2 http://localhost:3210/; then
              echo "3210 kapandı (${i}sn)"; exit 0
            fi
