name: Siteyi yayınla

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: web
        run: npm ci

      - name: Veritabanını hazırla (migrasyon + seed)
        working-directory: web
        run: |
          npx prisma migrate deploy
          npx prisma generate
          npx tsx prisma/seed.ts

      - name: Kalite kapısı (tip + lint + testler)
        working-directory: web
        run: |
          npx tsc --noEmit
          npx eslint app lib components --max-warnings=0
          npm run test

      - name: Tarayıcı kur (yayın kapıları için)
        # `arac/statik-kontrol.mjs` yayını gerçek tarayıcıda açar; depo
        # `playwright-core` kullandığı için tarayıcı ayrı kurulur.
        run: npx --yes playwright@1.62.1 install --with-deps chromium

      - name: Statik demo derle
        working-directory: web
        env:
          NEXT_PUBLIC_DEMO: '1'
        # `demo:build` dört adımdır:
        #   1. derle
        #   2. CSS varlık yollarını yayın köküyle öne ekle (demo-yol.mjs)
        #   3. her varlık başvurusunu diskte ara (yayin-kontrol.mjs)
        #   4. yayını gerçek tarayıcıda, ziyaretçi saati +90 gün iken aç
        #      ve konsola düşen her hatayı kusur say (statik-kontrol.mjs)
        #   5. her kütükte başlık ile satırın aynı ızgara raylarını
        #      taşıdığını üç genişlikte ölç (kolon-hizasi.mjs)
        # Herhangi biri kırılırsa iş durur; kusurlu yayın gh-pages'e çıkamaz.
        run: npm run demo:build

      - name: Çıktıyı gh-pages dalına yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gh-pages üretilen bir yayın kanalıdır: her seferinde sıfırdan
          # kurulur ve force push edilir. Dal yoksa (veya silindiyse) bu
          # adım onu yeniden oluşturur; GitHub Pages'i otomatik etkinleştirir.
          rm -rf .site && mkdir .site
          cp -a web/out/. .site/
          touch .site/.nojekyll
          cd .site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Yayın: ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
